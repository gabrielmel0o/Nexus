<body class="modo-start">
<!-- Área reservada ao logo definitivo (feito no Affinity). NÃO desenhar logo aqui. -->
<div class="logo">
  <img src="assets/logo.svg" alt="NEXUS"
       onerror="this.style.display='none';this.parentElement.dataset.fallback='LOGO';">
</div>
<div class="hint">arraste para girar · role ou pince para aproximar</div>
<!-- Botão de legenda: só visível quando painel-aberto está no body -->
<button class="nexus-legend-btn" aria-label="Legenda">?</button>
<!-- Container do botão START (só visível no modo-start) -->
<div class="nexus-start-container">
  <button class="nexus-start-btn">COMEÇAR</button>
</div>
