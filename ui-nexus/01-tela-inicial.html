<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ============================================================
  TELA INICIAL (nº 1) — referência visual: telas/01-tela_inicial.png
  ============================================================
  PARTES DESTA TELA E SEUS IDs:

  1. .fundo-teste          → fundo verde de teste (NÃO é parte da interface — REMOVER NO PROJETO FINAL)
  2. .gradiente-esquerda   → camada de gradiente roxo que cobre da borda esq. até ~65% da tela (aria-hidden)
  3. #logo-nexus           → logotipo SVG "NEXUS – O Universo da Sua Mente"
  4. #botao-comecar        → botão laranja COMEÇAR
  5. #botao-atualizar      → botão escuro ATUALIZAR
  6. #botao-gerenciamento  → botão escuro GERENCIAMENTO
  7. #botao-helena         → botão escuro HELENA

  AO CLICAR (lógica futura do projeto):
  - #botao-comecar      → se NÃO há dados salvos: exibe tela 2 (Começar)
                          se HÁ dados salvos: exibe tela 5 (Visualização)
  - #botao-atualizar    → exibe tela 3 (Atualizar); deve ser desabilitado se não há dados
  - #botao-gerenciamento→ exibe tela 4 (Gerenciamento)
  - #botao-helena       → exibe tela 5 com universo de demonstração (Helena)
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Tela Inicial</title>

  <!-- Base: variáveis CSS, fontes e regras comuns a todas as telas -->
  <link rel="stylesheet" href="css/base.css">

  <!-- Hover: anel de luz global — deve vir logo após base.css -->
  <link rel="stylesheet" href="css/hover.css">

  <!-- CSS específico desta tela -->
  <link rel="stylesheet" href="css/tela-inicial.css">

  <!-- Fundo de teste (REMOVER NO PROJETO FINAL) -->
  <link rel="stylesheet" href="css/fundo-teste.css">
</head>
<body>

  <!-- ============================================================
       FUNDO DE TESTE (verde sólido = tela sem desfoque)
       REMOVER NO PROJETO FINAL — substituído pelo canvas Three.js
       ============================================================ -->
  <div class="fundo-teste" aria-hidden="true"></div>


  <!-- ============================================================
       INTERFACE DA TELA INICIAL
       .nexus-ui: container fixo, fundo transparente, pointer-events none por padrão
       ============================================================ -->
  <div class="nexus-ui" id="tela-inicial">

    <!-- Gradiente: camada de fundo, da esquerda (sólido) até transparente.
         Não é clicável. Fica abaixo do conteúdo. -->
    <div class="gradiente-esquerda" aria-hidden="true"></div>

    <!-- Conteúdo principal: logotipo + botões.
         Fica acima do gradiente, alinhado à esquerda. -->
    <main class="conteudo-inicial">

      <!-- Logotipo NEXUS com tagline "O UNIVERSO DA SUA MENTE"
           A tagline já está desenhada dentro do próprio SVG.
           id="logo-nexus" para o JS poder referenciar se necessário. -->
      <div class="logo-wrapper" id="logo-nexus">
        <img
          src="svg/logotipo_inicial.svg"
          alt="NEXUS – O Universo da Sua Mente"
          class="logo-imagem"
        >
      </div>

      <!-- Menu principal: 4 botões empilhados.
           pointer-events:auto está herdado da regra de .nexus-ui button em base.css -->
      <nav class="menu-principal" aria-label="Menu principal do NEXUS">

        <!-- Botão 1: COMEÇAR (laranja)
             Ícone ▶ em caixa escura à esquerda; texto escuro sobre laranja -->
        <button class="btn btn-comecar" id="botao-comecar" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <!-- Caixa do ícone play (fundo terciário escuro, ícone em laranja) -->
          <span class="icone-comecar" aria-hidden="true">&#9654;</span>
          <!-- Texto: título + subtítulo -->
          <span class="btn-texto-grupo">
            <span class="btn-rotulo-principal">COMEÇAR</span>
            <span class="btn-rotulo-secundario">Veja seu próprio Universo</span>
          </span>
        </button>

        <!-- Botão 2: ATUALIZAR (escuro)
             Ícone SVG de setas circulares; texto branco -->
        <button class="btn btn-padrao btn-menu-item" id="botao-atualizar" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <span class="btn-icone" aria-hidden="true">
            <img src="svg/atualizar.svg" alt="">
          </span>
          <span class="btn-texto-grupo">
            <span class="btn-rotulo-principal">ATUALIZAR</span>
            <span class="btn-rotulo-secundario">Conte as novidades da sua vida</span>
          </span>
        </button>

        <!-- Botão 3: GERENCIAMENTO (escuro)
             Ícone SVG de engrenagem; texto branco -->
        <button class="btn btn-padrao btn-menu-item" id="botao-gerenciamento" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <span class="btn-icone" aria-hidden="true">
            <img src="svg/gerenciamento.svg" alt="">
          </span>
          <span class="btn-texto-grupo">
            <span class="btn-rotulo-principal">GERENCIAMENTO</span>
            <span class="btn-rotulo-secundario">Gerencie os seus dados</span>
          </span>
        </button>

        <!-- Botão 4: HELENA (escuro)
             Ícone SVG de silhueta; texto branco -->
        <button class="btn btn-padrao btn-menu-item" id="botao-helena" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <span class="btn-icone" aria-hidden="true">
            <img src="svg/helena.svg" alt="">
          </span>
          <span class="btn-texto-grupo">
            <span class="btn-rotulo-principal">HELENA</span>
            <span class="btn-rotulo-secundario">Veja uma demonstração do Nexus</span>
          </span>
        </button>

      </nav><!-- fim .menu-principal -->

    </main><!-- fim .conteudo-inicial -->

  </div><!-- fim #tela-inicial -->


  <!-- JS mínimo de teste: sem lógica de projeto -->
  <script src="js/teste.js"></script>

</body>
</html>
