<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ============================================================
  VISUALIZAÇÃO (nº 5) — referência visual: telas/05-visualização.png e telas/11-visualização.png
  ============================================================
  Esta tela exibe o universo 3D (canvas Three.js no fundo)
  e apenas a barra inferior de funcionalidades no rodapé.

  PARTES DESTA TELA E SEUS IDs:
  1. .fundo-teste       → fundo verde de teste sem desfoque (REMOVER NO PROJETO FINAL)
  2. #tela-visualizacao → container raiz (pointer-events: none)
  3. #barra-inferior    → barra horizontal fixa no rodapé da viewport

  ZONA ESQUERDA:
  4. #botao-menu        → botão com isotipo laranja NEXUS para abrir o menu lateral (tela 8)

  ZONA CENTRAL:
  5. #botao-retroceder  → botão textual para retroceder à fase anterior da timeline
  6. .icone-ampulheta   → ícone decorativo de ampulheta (tempo/fase)
  7. #botao-avancar     → botão textual para avançar à próxima fase da timeline

  ZONA DIREITA:
  8. #botao-saibamais   → botão circular "?" para abrir o painel explicativo (tela 6)

  AO CLICAR (lógica futura do projeto):
  - #botao-menu        → abre o menu (tela 8)
  - #botao-retroceder  → retrocede o estado do universo 3D
  - #botao-avancar     → avança o estado do universo 3D
  - #botao-saibamais   → abre o painel "Como ler este universo" (tela 6)
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Visualização</title>

  <!-- Base: variáveis CSS, fontes e regras comuns -->
  <link rel="stylesheet" href="css/base.css">

  <!-- Hover: anel de luz global — deve vir logo após base.css -->
  <link rel="stylesheet" href="css/hover.css">

  <!-- CSS da barra inferior: compartilhado entre telas 5, 6 e 7 -->
  <link rel="stylesheet" href="css/barra-inferior.css">

  <!-- Fundo de teste verde sem desfoque (REMOVER NO PROJETO FINAL) -->
  <link rel="stylesheet" href="css/fundo-teste.css">
</head>
<body>

  <!-- FUNDO DE TESTE (REMOVER NO PROJETO FINAL) -->
  <div class="fundo-teste" aria-hidden="true"></div>

  <!-- INTERFACE DE VISUALIZAÇÃO -->
  <div class="nexus-ui" id="tela-visualizacao">

    <!-- BARRA INFERIOR DE CONTROLE -->
    <footer class="barra-inferior" id="barra-inferior">

      <!-- Esquerda: isotipo (abre o menu) -->
      <div class="barra-zona barra-esquerda">
        <button class="barra-btn" id="botao-menu" type="button" aria-label="Menu NEXUS">
          <span class="btn__feixe" aria-hidden="true"></span>
          <img src="svg/isotipo.svg" class="icone-barra icone-isotipo" alt="NEXUS">
        </button>
      </div>

      <!-- Centro: navegação temporal (RETROCEDER | ampulheta | AVANÇAR) -->
      <div class="barra-zona barra-centro">
        <button class="barra-btn barra-btn-texto" id="botao-retroceder" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          RETROCEDER
        </button>
        <img src="svg/ampulheta.svg" class="icone-barra icone-ampulheta" aria-hidden="true" alt="">
        <button class="barra-btn barra-btn-texto" id="botao-avancar" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          AVANÇAR
        </button>
      </div>

      <!-- Direita: saiba mais (?) -->
      <div class="barra-zona barra-direita">
        <button class="barra-btn" id="botao-saibamais" type="button" aria-label="Como ler este universo">
          <span class="btn__feixe" aria-hidden="true"></span>
          <img src="svg/saibamais.svg" class="icone-barra icone-saibamais" alt="Saiba mais">
        </button>
      </div>

    </footer>

  </div><!-- fim #tela-visualizacao -->

</body>
</html>
