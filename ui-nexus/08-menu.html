<!DOCTYPE html>
<html lang="pt-BR">
<!--
  ============================================================
  MENU (nº 8) — referência visual: telas/08-menu.png
  ============================================================
  Esta tela é exibida quando o usuário clica no isotipo NEXUS
  (botão de menu no canto inferior esquerdo da barra inferior).
  O universo 3D ao fundo recebe um desfoque gaussiano de 8,5px e
  o menu principal se abre no lado esquerdo da tela.

  PARTES DESTA TELA E SEUS IDs:
  1. .fundo-teste.com-desfoque → fundo de teste com listras (REMOVER NO PROJETO FINAL)
  2. #fundo-desfocado          → camada com backdrop-filter: blur(8.5px)
  3. #tela-menu                → container raiz da tela (pointer-events: none)
  4. #painel-menu              → painel flutuante de vidro no lado esquerdo
  5. #logo-menu                → logotipo expandido NEXUS com anel de órbita
  6. #botao-voltar-inicio      → botão com ícone de menu: "VOLTAR A TELA INICIAL"
  7. #botao-abrir-sair         → botão com ícone de energia: "SAIR"
  8. #dica-esc                 → indicação visual "[ESC] Voltar" no canto inferior

  AO CLICAR / PRESSIONAR (lógica futura do projeto):
  - #botao-voltar-inicio → retorna para a Tela Inicial (tela 1)
  - #botao-abrir-sair    → abre o modal de confirmação de saída (tela 9)
  - Tecla ESC ou clique fora → fecha o menu e volta para a tela 5 (visualização livre)
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Menu</title>

  <!-- Base: variáveis CSS, fontes e regras comuns -->
  <link rel="stylesheet" href="css/base.css">

  <!-- Hover: anel de luz global — deve vir logo após base.css -->
  <link rel="stylesheet" href="css/hover.css">

  <!-- CSS específico desta tela: painel do menu e botões -->
  <link rel="stylesheet" href="css/tela-menu.css">

  <!-- Fundo de teste com listras coloridas para conferir o blur (REMOVER NO PROJETO FINAL) -->
  <link rel="stylesheet" href="css/fundo-teste.css">
</head>
<body>

  <!-- FUNDO DE TESTE (REMOVER NO PROJETO FINAL) -->
  <div class="fundo-teste com-desfoque" aria-hidden="true"></div>

  <!-- CAMADA DE DESFOQUE (8,5px) -->
  <div id="fundo-desfocado" aria-hidden="true"></div>

  <!-- INTERFACE DO MENU -->
  <div class="nexus-ui" id="tela-menu">

    <!-- PAINEL LATERAL ESQUERDO -->
    <nav class="painel-menu" id="painel-menu" aria-label="Menu principal">

      <!-- Logotipo NEXUS no topo -->
      <div class="menu-logo-container">
        <img src="svg/nexus_menu.svg" class="menu-logo" id="logo-menu" alt="NEXUS">
      </div>

      <!-- Ações do menu no rodapé do painel -->
      <div class="menu-acoes">

        <!-- Voltar à tela inicial -->
        <button class="btn-menu-lateral" id="botao-voltar-inicio" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <img src="svg/menu.svg" class="icone-menu-item icone-menu-hamburguer" alt="" aria-hidden="true">
          <span class="texto-menu-item">VOLTAR A TELA INICIAL</span>
        </button>

        <!-- Sair (abre confirmação) -->
        <button class="btn-menu-lateral" id="botao-abrir-sair" type="button">
          <span class="btn__feixe" aria-hidden="true"></span>
          <img src="svg/sair.svg" class="icone-menu-item icone-menu-sair" alt="" aria-hidden="true">
          <span class="texto-menu-item">SAIR</span>
        </button>

      </div>

    </nav><!-- fim #painel-menu -->

    <!-- Dica de atalho no canto inferior esquerdo -->
    <div class="dica-atalho-menu" id="dica-esc" aria-label="Pressione ESC para voltar">
      <kbd class="tecla-atalho">ESC</kbd>
      <span class="texto-atalho">Voltar</span>
    </div>

  </div><!-- fim #tela-menu -->

  <script src="js/teste.js"></script>
</body>
</html>
